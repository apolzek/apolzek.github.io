- text: "A complexidade assintótica mede, de forma teórica, como o tempo de execução ou o consumo de memória de um algoritmo cresce conforme aumenta o tamanho da entrada. A Notação Big O expressa o limite superior desse crescimento; Θ expressa o limite justo e Ω, o inferior."
  text_en: "Asymptotic complexity measures, theoretically, how an algorithm's running time or memory usage grows as the input size increases. Big O notation expresses the upper bound of that growth; Θ expresses the tight bound and Ω, the lower bound."
  date: "2026-07-13"
