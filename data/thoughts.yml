- text: "O patrimonialismo é um conceito sociológico e político que descreve a incapacidade de separar o que é público do que é privado. Nesse sistema, o governante ou detentor do poder trata a máquina do Estado e os recursos públicos como se fossem sua propriedade pessoal."
  text_en: "Patrimonialism is a sociological and political concept describing the inability to separate what is public from what is private. In this system, the ruler or holder of power treats the state machinery and public resources as if they were their personal property."
  date: "2026-06-26"
- text: 'Tácito, há quase 2 mil anos: "Corruptissima re publica plurimae leges | Quanto mais corrompido o Estado, mais numerosas as leis" (Anais, III, 27)'
