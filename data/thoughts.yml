- text: "No Collector contrib, quanto mais componentes você adiciona ao pipeline, mais difícil fica garantir a previsibilidade da execução. Cada combinação nova, e cada bump de versão, é mais uma variável que pode mudar o comportamento de um pipeline que antes funcionava."
  text_en: "In the contrib Collector, the more components you add to your pipeline, the harder it gets to guarantee execution predictability. Every new combination, and every version bump, is one more variable that can change the behavior of a pipeline that used to work."
