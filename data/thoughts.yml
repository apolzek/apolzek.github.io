- text: "Educar começa muito antes dos filhos. Começa em nós, quando temos a coragem de enfrentar nossas próprias imperfeições, preencher os vazios que herdamos e escolher viver aquilo que desejamos ensinar. O exemplo não é apenas uma lição; é uma presença constante, a linguagem mais poderosa da educação. Educar nunca foi fácil, mas me recuso a entregar a terceiros a missão de formar aquilo que Deus confiou a mim."
  text_en: "Education begins long before our children. It begins in us, when we have the courage to face our own imperfections, fill the voids we inherited and choose to live what we wish to teach. Example is not just a lesson; it is a constant presence, the most powerful language of education. Raising children was never easy, but I refuse to hand over to others the mission of forming what God entrusted to me."
  date: "2026-07-13"
- text: "O dilema do porco-espinho de Arthur Schopenhauer mostra que, quando uma pessoa se aproxima demais dos outros, pode se machucar; quando se afasta demais, sente o frio da solidão."
  text_en: "Arthur Schopenhauer's hedgehog's dilemma shows that when a person gets too close to others, they may get hurt; when they move too far away, they feel the cold of loneliness."
