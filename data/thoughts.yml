- text: 'É comum nos perdermos na escuridão. Sabendo disso, esteja sempre pronto para resgatar aquele que está próximo de você e se perdeu pelo caminho. Estenda a mão, traga-o para cima e não o deixe para trás. Como já dizia o ditado: “Go back to the wagon.” Confie em Deus, porque ninguém precisa atravessar a escuridão sozinho.'
