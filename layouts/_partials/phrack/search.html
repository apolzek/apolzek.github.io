{{- /* Busca global: overlay azul aberto por [ Search ], "/" ou Ctrl/Cmd+K.
       Na home, começar a digitar em qualquer lugar também abre a busca.
       O índice (/search-index.json) só é baixado na primeira abertura. */ -}}
<div class="blur-overlay" id="search-overlay" hidden>
  <div class="search-container" role="dialog" aria-modal="true" aria-label="Buscar">
    <button type="button" class="search-close-button" data-search-close>[ Fechar ]</button>
    <input class="search-input" id="search-input" type="search" autocomplete="off" spellcheck="false"
           aria-label="Buscar no blog" placeholder="Buscar em posts, thoughts, gallery e cheatsheet...">
    <div class="search-hint"><span id="search-status"></span><span>↑↓ navega · Enter abre · Esc fecha</span></div>
    <div class="search-results-box" id="search-results">
      <div class="search-message"><span>Digite algo para ver os resultados</span></div>
    </div>
  </div>
</div>
