{{- /* Menu de temas (assets/js/themes.js preenche a lista). */ -}}
<div class="blur-overlay" id="theme-overlay" hidden>
  <div class="search-container theme-container" role="dialog" aria-modal="true" aria-label="Tema">
    <div class="theme-head">
      <strong>.:: omarchy theme ::.</strong>
      <button type="button" class="search-close-button" data-theme-close>[ Fechar ]</button>
    </div>
    <div class="search-hint"><span>↑↓ troca · Enter/Esc fecha</span><span>t / shift+t em qualquer página</span></div>
    <div class="theme-list" id="theme-list" role="menu"></div>
  </div>
</div>
<div class="theme-toast" id="theme-toast" role="status" hidden></div>
