{{ define "main" }}
  {{- $pages := .Pages.ByDate.Reverse -}}
  <div class="details tag-list"><strong>Tag</strong> : <span class="muted">#</span>{{ .Title }} <span class="muted">· {{ i18n "postCount" (dict "Count" (len $pages)) }}</span> · [ <a href="{{ "/tags/" | relURL }}">todas as tags</a> ]</div>
  <h1 class="opt"><span class="rt"><a href="{{ .RelPermalink }}index.xml">RSS</a></span><strong>Tag</strong> : #{{ .Title }}</h1>
  {{ partial "phrack/post-table.html" $pages }}
  {{- with .Content }}<div class="md-article-area">{{ . }}</div>{{ end }}
{{ end }}
